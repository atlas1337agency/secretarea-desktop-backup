
name: Release SecretArea Desktop App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'

  workflow_dispatch:
    inputs:
      force_release:
        description: 'Rebuild and update release even if this version tag already exists'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  check-version:
    name: Check Version for Release
    runs-on: windows-latest

    outputs:
      should_release: ${{ steps.meta.outputs.should_release }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check package.json version against existing GitHub Releases
        id: meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RELEASE: ${{ inputs.force_release }}
        run: |
          $ErrorActionPreference = "Stop"

          # Read and validate package.json
          $pkg = Get-Content -Raw package.json | ConvertFrom-Json

          if ([string]::IsNullOrWhiteSpace([string]$pkg.version)) {
            throw "package.json version is empty or missing."
          }

          $version = ([string]$pkg.version).Trim()

          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$') {
            throw "Invalid package.json version: $version"
          }

          $tag = "v$version"

          Write-Host "Package version: $version"
          Write-Host "Release tag: $tag"

          # Validate pushed Git tag
          if ($env:GITHUB_REF.StartsWith("refs/tags/")) {
            $pushedTag = $env:GITHUB_REF_NAME

            if ($pushedTag -ne $tag) {
              throw "Tag '$pushedTag' does not match package.json version '$tag'. Update package.json version first."
            }
          }

          # Check whether the GitHub Release already exists
          $releaseExists = $false

          $releaseUrl = "https://api.github.com/repos/$env:REPOSITORY/releases/tags/$tag"

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          try {
            $release = Invoke-RestMethod `
              -Uri $releaseUrl `
              -Headers $headers `
              -Method Get

            $releaseExists = $true
            Write-Host "Release $tag already exists."
          }
          catch {
            $statusCode = 0

            if ($_.Exception.Response) {
              $statusCode = [int]$_.Exception.Response.StatusCode
            }

            if ($statusCode -eq 404) {
              $releaseExists = $false
              Write-Host "Release $tag does not exist."
            }
            else {
              throw "GitHub API error while checking release: $($_.Exception.Message)"
            }
          }

          # Determine whether to publish
          $isManualForce = (
            $env:EVENT_NAME -eq "workflow_dispatch" -and
            $env:FORCE_RELEASE -eq "true"
          )

          $isTagPush = $env:GITHUB_REF.StartsWith("refs/tags/")

          if (-not $releaseExists -or $isManualForce -or $isTagPush) {
            $shouldRelease = "true"
            Write-Host "Release $tag will be built and published."
          }
          else {
            $shouldRelease = "false"
            Write-Host "Release $tag already exists. Skipping build."
          }

          # Export GitHub Actions outputs
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "should_release=$shouldRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  build-and-release-windows:
    name: Build & Publish Windows Installer
    needs: check-version

    if: needs.check-version.outputs.should_release == 'true'

    permissions:
      contents: write

    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          npm ci --no-audit --no-fund

          if (
            -not (Test-Path "node_modules/@typescript/typescript-win32-x64") -or
            -not (Test-Path "node_modules/@rolldown/binding-win32-x64-msvc")
          ) {
            Write-Host "Resolving Windows x64 optional native binaries..."

            npm install --no-audit --no-fund
          }

      - name: Run TypeScript check
        run: npm run lint

      - name: Install Electron & Electron Builder
        run: npm install --no-save electron electron-builder

      - name: Build production web bundle
        run: npm run build

      - name: Package Windows NSIS Installer & Updater Metadata
        run: npx electron-builder --win nsis --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Verify installer and updater metadata files
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          $expectedVersion = $env:EXPECTED_VERSION

          $requiredFiles = @(
            "release/SecretArea.exe",
            "release/SecretArea.exe.blockmap",
            "release/latest.yml"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Missing required release artifact: $file"
            }

            Write-Host "Verified: $file"
          }

          $latestYml = Get-Content -Raw release/latest.yml

          Write-Host "--- release/latest.yml ---"
          Write-Host $latestYml

          if ($latestYml -notmatch "(?m)^version:\s*['`"]?$([regex]::Escape($expectedVersion))['`"]?\s*$") {
            throw "release/latest.yml version does not match package.json version $expectedVersion"
          }

          if ($latestYml -notmatch "SecretArea\.exe") {
            throw "release/latest.yml does not reference SecretArea.exe"
          }

          Write-Host "All updater metadata checks passed."

      - name: Upload Windows release workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecretArea-${{ needs.check-version.outputs.tag }}-Windows
          path: |
            release/SecretArea.exe
            release/SecretArea.exe.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Publish Installer & Metadata to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: SecretArea Desktop ${{ needs.check-version.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release/SecretArea.exe
            release/SecretArea.exe.blockmap
            release/latest.yml
