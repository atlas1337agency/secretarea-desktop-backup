name: Release SecretArea Desktop App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'

  workflow_dispatch:
    inputs:
      force_release:
        description: 'Rebuild and update release even if this version tag already exists'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check Version for Release
    runs-on: ubuntu-latest

    outputs:
      should_release: ${{ steps.meta.outputs.should_release }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate package.json version against tag and GitHub Releases
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          INPUT_GITHUB_REF: ${{ github.ref }}
          INPUT_GITHUB_REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RELEASE: ${{ inputs.force_release }}
        run: |
          set -euo pipefail

          node << 'EOF'
          const fs = require('fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const version = typeof pkg.version === 'string' ? pkg.version.trim() : '';

          if (!version) {
            throw new Error('package.json version is empty or missing.');
          }

          if (!/^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error(`Invalid package.json version: ${version}`);
          }

          const tag = `v${version}`;

          console.log(`Package version: ${version}`);
          console.log(`Release tag: ${tag}`);

          const githubRef = process.env.INPUT_GITHUB_REF || '';
          const refName = process.env.INPUT_GITHUB_REF_NAME || '';

          if (githubRef.startsWith('refs/tags/') && refName !== tag) {
            throw new Error(
              `Tag '${refName}' does not match package.json version '${tag}'. Update package.json version first.`
            );
          }

          (async () => {
            const repo = process.env.REPOSITORY;
            const token = process.env.GH_TOKEN;

            const releaseUrl =
              `https://api.github.com/repos/${repo}/releases/tags/${encodeURIComponent(tag)}`;

            const res = await fetch(releaseUrl, {
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
            });

            let releaseExists = false;

            if (res.status === 200) {
              releaseExists = true;
              console.log(`Release ${tag} already exists.`);
            } else if (res.status === 404) {
              releaseExists = false;
              console.log(`Release ${tag} does not exist.`);
            } else {
              const responseText = await res.text().catch(() => '');
              throw new Error(
                `GitHub API error while checking release (HTTP ${res.status}): ${responseText}`
              );
            }

            const isManualForce =
              process.env.EVENT_NAME === 'workflow_dispatch' &&
              process.env.FORCE_RELEASE === 'true';

            const isTagPush = githubRef.startsWith('refs/tags/');

            const shouldRelease =
              (!releaseExists || isManualForce || isTagPush) ? 'true' : 'false';

            console.log(
              shouldRelease === 'true'
                ? `Release ${tag} will be built for Windows, Linux, and macOS and published.`
                : `Release ${tag} already exists. Skipping build.`
            );

            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `version=${version}\n`
            );

            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `tag=${tag}\n`
            );

            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `should_release=${shouldRelease}\n`
            );
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF

  build-windows:
    name: Build Windows x64 (NSIS)
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron & Electron Builder (Windows)
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-win-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            electron-win-${{ runner.os }}-

      - name: Install project dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) {
            throw "npm ci failed with exit code $LASTEXITCODE"
          }

          if (
            -not (Test-Path "node_modules/@typescript/typescript-win32-x64") -or
            -not (Test-Path "node_modules/@rolldown/binding-win32-x64-msvc")
          ) {
            Write-Host "Resolving Windows x64 optional native binaries..."
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) {
              throw "Windows optional native binary installation failed."
            }
          }

      - name: Run TypeScript check
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run lint
          if ($LASTEXITCODE -ne 0) {
            throw "TypeScript check failed with exit code $LASTEXITCODE"
          }

      - name: Build production web bundle for tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run build
          if ($LASTEXITCODE -ne 0) {
            throw "Production web build failed with exit code $LASTEXITCODE"
          }

      - name: Verify production bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "dist/index.html")) {
            throw "Production build failed: dist/index.html is missing."
          }

          Write-Host "Production bundle verified."

      - name: Run desktop & optimization test suites
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Node version:"
          node --version

          Write-Host "=== Starting CJS test suite ==="

          node --test --test-force-exit tests/*.cjs.test.cjs
          if ($LASTEXITCODE -ne 0) {
            throw "CJS test suite failed with exit code $LASTEXITCODE"
          }

          Write-Host "=== CJS test suite completed successfully ==="
          Write-Host "=== Starting TypeScript hardware audit tests ==="

          node --import tsx --test --test-force-exit tests/hardwareAudit.ts.test.ts
          if ($LASTEXITCODE -ne 0) {
            throw "Hardware audit test suite failed with exit code $LASTEXITCODE"
          }

          Write-Host "=== All desktop & optimization test suites passed ==="

      - name: Install Electron & Electron Builder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm install --no-save --no-audit --no-fund electron electron-builder
          if ($LASTEXITCODE -ne 0) {
            throw "Electron and Electron Builder installation failed."
          }

      - name: Build production web bundle & package Windows NSIS installer
        run: npm run desktop:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Verify Windows installer and updater metadata
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          $expectedVersion = $env:EXPECTED_VERSION

          $requiredFiles = @(
            "release/SecretArea.exe",
            "release/SecretArea.exe.blockmap",
            "release/latest.yml"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Missing required Windows release artifact: $file"
            }

            Write-Host "Verified: $file"
          }

          $latestYml = Get-Content -Raw release/latest.yml

          Write-Host "--- release/latest.yml ---"
          Write-Host $latestYml

          if ($latestYml -notmatch "(?m)^version:\s*['`"]?$([regex]::Escape($expectedVersion))['`"]?\s*$") {
            throw "release/latest.yml version does not match package.json version $expectedVersion"
          }

          if ($latestYml -notmatch "SecretArea\.exe") {
            throw "release/latest.yml does not reference SecretArea.exe"
          }

          Write-Host "All Windows updater metadata checks passed."

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecretArea-${{ needs.check-version.outputs.tag }}-Windows
          path: |
            release/SecretArea.exe
            release/SecretArea.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 5

  build-linux:
    name: Build Linux x64 (AppImage + DEB)
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron & Electron Builder (Linux)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-linux-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            electron-linux-${{ runner.os }}-

      - name: Install project dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm ci --no-audit --no-fund

          if [ ! -d "node_modules/@typescript/typescript-linux-x64" ] || [ ! -d "node_modules/@rolldown/binding-linux-x64-gnu" ]; then
            echo "Resolving Linux x64 optional native binaries..."
            npm install --no-audit --no-fund
          fi

      - name: Run TypeScript check
        run: npm run lint

      - name: Build production web bundle for tests
        run: npm run build

      - name: Verify production bundle
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/index.html || {
            echo "Production build failed: dist/index.html is missing." >&2
            exit 1
          }

          echo "Production bundle verified."

      - name: Run desktop & optimization test suites
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/*.cjs.test.cjs
          npx tsx --test tests/hardwareAudit.ts.test.ts

      - name: Install Electron & Electron Builder
        run: npm install --no-save --no-audit --no-fund electron electron-builder

      - name: Build production web bundle & package Linux AppImage + DEB
        run: npm run desktop:build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Linux packages and updater metadata
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail

          APPIMAGE_FILE="release/SecretArea-${EXPECTED_VERSION}-linux-x86_64.AppImage"
          DEB_FILE="release/SecretArea-${EXPECTED_VERSION}-linux-amd64.deb"
          LATEST_LINUX_YML="release/latest-linux.yml"

          for file in "$APPIMAGE_FILE" "$DEB_FILE" "$LATEST_LINUX_YML"; do
            if [ ! -s "$file" ]; then
              echo "Missing or empty Linux release artifact: $file" >&2
              exit 1
            fi

            echo "Verified: $file"
          done

          chmod +x "$APPIMAGE_FILE"

          echo "--- release/latest-linux.yml ---"
          cat "$LATEST_LINUX_YML"

          EXPECTED_VERSION="$EXPECTED_VERSION" node << 'EOF'
          const fs = require('fs');
          const ver = process.env.EXPECTED_VERSION;
          const yml = fs.readFileSync('release/latest-linux.yml', 'utf8');

          const escapedVersion = ver.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const verRegex = new RegExp(
            `^version:\\s*['"]?${escapedVersion}['"]?\\s*$`,
            'm'
          );

          if (!verRegex.test(yml)) {
            throw new Error(
              `release/latest-linux.yml version does not match package.json version ${ver}`
            );
          }

          if (!yml.includes(`SecretArea-${ver}-linux-x86_64.AppImage`)) {
            throw new Error(
              `release/latest-linux.yml does not reference SecretArea-${ver}-linux-x86_64.AppImage`
            );
          }
          EOF

          dpkg-deb -I "$DEB_FILE"

          echo "All Linux package & updater metadata checks passed."

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecretArea-${{ needs.check-version.outputs.tag }}-Linux
          path: |
            release/SecretArea-${{ needs.check-version.outputs.version }}-linux-x86_64.AppImage
            release/SecretArea-${{ needs.check-version.outputs.version }}-linux-amd64.deb
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 5

  build-macos-x64:
    name: Build macOS Intel (x64 DMG + ZIP)
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: macos-15-intel

    steps:
      - name: Verify Intel x64 runner architecture
        shell: bash
        run: |
          set -euo pipefail
          ARCH=$(uname -m)
          echo "Detected macOS runner architecture: $ARCH"
          if [ "$ARCH" != "x86_64" ]; then
            echo "Expected x86_64 runner architecture for Intel build, got '$ARCH'" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron & Electron Builder (macOS x64)
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-mac-x64-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            electron-mac-x64-${{ runner.os }}-

      - name: Install project dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm ci --no-audit --no-fund

          if [ ! -d "node_modules/@typescript/typescript-darwin-x64" ] || [ ! -d "node_modules/@rolldown/binding-darwin-x64" ]; then
            echo "Resolving macOS x64 optional native binaries..."
            npm install --no-audit --no-fund
          fi

      - name: Run TypeScript check
        run: npm run lint

      - name: Build production web bundle for tests
        run: npm run build

      - name: Verify production bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html || {
            echo "Production build failed: dist/index.html is missing." >&2
            exit 1
          }
          echo "Production bundle verified."

      - name: Run desktop & optimization test suites
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/*.cjs.test.cjs
          npx tsx --test tests/hardwareAudit.ts.test.ts tests/performanceOptimization.ts.test.ts

      - name: Install Electron & Electron Builder and rebuild native deps
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund electron electron-builder
          npx electron-builder install-app-deps --arch=x64

      - name: Build & package macOS x64 DMG + ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          RESOLVED_CERT="${CSC_LINK:-${APPLE_CERTIFICATE:-}}"
          RESOLVED_PASS="${CSC_KEY_PASSWORD:-${APPLE_CERTIFICATE_PASSWORD:-}}"
          HAS_NOTARIZE=false
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            HAS_NOTARIZE=true
          fi

          EXTRA_BUILDER_ARGS=()
          if [ -n "$RESOLVED_CERT" ] && [ -n "$RESOLVED_PASS" ]; then
            export CSC_LINK="$RESOLVED_CERT"
            export CSC_KEY_PASSWORD="$RESOLVED_PASS"
            if [ "$HAS_NOTARIZE" = true ]; then
              echo "Signing status: SIGNED (Developer ID certificate configured). Notarization status: ENABLED."
            else
              echo "Signing status: SIGNED (Developer ID certificate configured). Notarization status: DISABLED (missing APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, or APPLE_TEAM_ID)."
              unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
              EXTRA_BUILDER_ARGS=(-c.mac.notarize=false)
            fi
          else
            echo "Signing status: UNSIGNED (no CSC_LINK / APPLE_CERTIFICATE configured; using CSC_IDENTITY_AUTO_DISCOVERY=false). Notarization status: DISABLED."
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            EXTRA_BUILDER_ARGS=(-c.mac.notarize=false)
          fi

          if [ ${#EXTRA_BUILDER_ARGS[@]} -gt 0 ]; then
            npm run desktop:build:mac:x64 -- "${EXTRA_BUILDER_ARGS[@]}"
          else
            npm run desktop:build:mac:x64
          fi

      - name: Verify macOS x64 packages and updater metadata
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail

          DMG_FILE="release/SecretArea-${EXPECTED_VERSION}-mac-x64.dmg"
          ZIP_FILE="release/SecretArea-${EXPECTED_VERSION}-mac-x64.zip"
          BLOCKMAP_FILE="release/SecretArea-${EXPECTED_VERSION}-mac-x64.zip.blockmap"
          LATEST_MAC_YML="release/latest-mac.yml"
          PER_ARCH_YML="release/latest-mac-x64.yml"

          for file in "$DMG_FILE" "$ZIP_FILE" "$BLOCKMAP_FILE" "$LATEST_MAC_YML"; do
            if [ ! -s "$file" ]; then
              echo "Missing or empty macOS x64 release artifact: $file" >&2
              exit 1
            fi
            echo "Verified: $file"
          done

          cp -f "$LATEST_MAC_YML" "$PER_ARCH_YML"

          echo "--- release/latest-mac-x64.yml ---"
          cat "$PER_ARCH_YML"

          EXPECTED_VERSION="$EXPECTED_VERSION" node << 'EOF'
          const fs = require('fs');
          const crypto = require('crypto');
          const ver = process.env.EXPECTED_VERSION;
          const yml = fs.readFileSync('release/latest-mac-x64.yml', 'utf8');
          const escapedVersion = ver.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const verRegex = new RegExp(`^version:\\s*['"]?${escapedVersion}['"]?\\s*$`, 'm');

          if (!verRegex.test(yml)) {
            throw new Error(`release/latest-mac-x64.yml version does not match package.json version ${ver}`);
          }
          const zipName = `SecretArea-${ver}-mac-x64.zip`;
          if (!yml.includes(zipName)) {
            throw new Error(`release/latest-mac-x64.yml does not reference ${zipName}`);
          }
          const actualSha512 = crypto.createHash('sha512').update(fs.readFileSync(`release/${zipName}`)).digest('base64');
          if (!yml.includes(actualSha512)) {
            throw new Error(`release/latest-mac-x64.yml sha512 does not match actual ${zipName} digest`);
          }
          console.log(`Verified x64 ZIP SHA-512 parity (${zipName}).`);
          EOF

          echo "All macOS x64 package & updater metadata checks passed."

      - name: Upload macOS x64 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecretArea-${{ needs.check-version.outputs.tag }}-macOS-x64
          path: |
            release/SecretArea-${{ needs.check-version.outputs.version }}-mac-x64.dmg
            release/SecretArea-${{ needs.check-version.outputs.version }}-mac-x64.zip
            release/SecretArea-${{ needs.check-version.outputs.version }}-mac-x64.zip.blockmap
            release/latest-mac-x64.yml
          if-no-files-found: error
          retention-days: 5

  build-macos-arm64:
    name: Build macOS Apple Silicon (arm64 DMG + ZIP)
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: macos-15

    steps:
      - name: Verify Apple Silicon arm64 runner architecture
        shell: bash
        run: |
          set -euo pipefail
          ARCH=$(uname -m)
          echo "Detected macOS runner architecture: $ARCH"
          if [ "$ARCH" != "arm64" ]; then
            echo "Expected arm64 runner architecture for Apple Silicon build, got '$ARCH'" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron & Electron Builder (macOS arm64)
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-mac-arm64-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            electron-mac-arm64-${{ runner.os }}-

      - name: Install project dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm ci --no-audit --no-fund

          if [ ! -d "node_modules/@typescript/typescript-darwin-arm64" ] || [ ! -d "node_modules/@rolldown/binding-darwin-arm64" ]; then
            echo "Resolving macOS arm64 optional native binaries..."
            npm install --no-audit --no-fund
          fi

      - name: Run TypeScript check
        run: npm run lint

      - name: Build production web bundle for tests
        run: npm run build

      - name: Verify production bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html || {
            echo "Production build failed: dist/index.html is missing." >&2
            exit 1
          }
          echo "Production bundle verified."

      - name: Run desktop & optimization test suites
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/*.cjs.test.cjs
          npx tsx --test tests/hardwareAudit.ts.test.ts tests/performanceOptimization.ts.test.ts

      - name: Install Electron & Electron Builder and rebuild native deps
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund electron electron-builder
          npx electron-builder install-app-deps --arch=arm64

      - name: Build & package macOS arm64 DMG + ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          RESOLVED_CERT="${CSC_LINK:-${APPLE_CERTIFICATE:-}}"
          RESOLVED_PASS="${CSC_KEY_PASSWORD:-${APPLE_CERTIFICATE_PASSWORD:-}}"
          HAS_NOTARIZE=false
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            HAS_NOTARIZE=true
          fi

          EXTRA_BUILDER_ARGS=()
          if [ -n "$RESOLVED_CERT" ] && [ -n "$RESOLVED_PASS" ]; then
            export CSC_LINK="$RESOLVED_CERT"
            export CSC_KEY_PASSWORD="$RESOLVED_PASS"
            if [ "$HAS_NOTARIZE" = true ]; then
              echo "Signing status: SIGNED (Developer ID certificate configured). Notarization status: ENABLED."
            else
              echo "Signing status: SIGNED (Developer ID certificate configured). Notarization status: DISABLED (missing APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, or APPLE_TEAM_ID)."
              unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
              EXTRA_BUILDER_ARGS=(-c.mac.notarize=false)
            fi
          else
            echo "Signing status: UNSIGNED (no CSC_LINK / APPLE_CERTIFICATE configured; using CSC_IDENTITY_AUTO_DISCOVERY=false). Notarization status: DISABLED."
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            EXTRA_BUILDER_ARGS=(-c.mac.notarize=false)
          fi

          if [ ${#EXTRA_BUILDER_ARGS[@]} -gt 0 ]; then
            npm run desktop:build:mac:arm64 -- "${EXTRA_BUILDER_ARGS[@]}"
          else
            npm run desktop:build:mac:arm64
          fi

      - name: Verify macOS arm64 packages and updater metadata
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail

          DMG_FILE="release/SecretArea-${EXPECTED_VERSION}-mac-arm64.dmg"
          ZIP_FILE="release/SecretArea-${EXPECTED_VERSION}-mac-arm64.zip"
          BLOCKMAP_FILE="release/SecretArea-${EXPECTED_VERSION}-mac-arm64.zip.blockmap"
          LATEST_MAC_YML="release/latest-mac.yml"
          PER_ARCH_YML="release/latest-mac-arm64.yml"

          for file in "$DMG_FILE" "$ZIP_FILE" "$BLOCKMAP_FILE" "$LATEST_MAC_YML"; do
            if [ ! -s "$file" ]; then
              echo "Missing or empty macOS arm64 release artifact: $file" >&2
              exit 1
            fi
            echo "Verified: $file"
          done

          cp -f "$LATEST_MAC_YML" "$PER_ARCH_YML"

          echo "--- release/latest-mac-arm64.yml ---"
          cat "$PER_ARCH_YML"

          EXPECTED_VERSION="$EXPECTED_VERSION" node << 'EOF'
          const fs = require('fs');
          const crypto = require('crypto');
          const ver = process.env.EXPECTED_VERSION;
          const yml = fs.readFileSync('release/latest-mac-arm64.yml', 'utf8');
          const escapedVersion = ver.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const verRegex = new RegExp(`^version:\\s*['"]?${escapedVersion}['"]?\\s*$`, 'm');

          if (!verRegex.test(yml)) {
            throw new Error(`release/latest-mac-arm64.yml version does not match package.json version ${ver}`);
          }
          const zipName = `SecretArea-${ver}-mac-arm64.zip`;
          if (!yml.includes(zipName)) {
            throw new Error(`release/latest-mac-arm64.yml does not reference ${zipName}`);
          }
          const actualSha512 = crypto.createHash('sha512').update(fs.readFileSync(`release/${zipName}`)).digest('base64');
          if (!yml.includes(actualSha512)) {
            throw new Error(`release/latest-mac-arm64.yml sha512 does not match actual ${zipName} digest`);
          }
          console.log(`Verified arm64 ZIP SHA-512 parity (${zipName}).`);
          EOF

          echo "All macOS arm64 package & updater metadata checks passed."

      - name: Upload macOS arm64 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecretArea-${{ needs.check-version.outputs.tag }}-macOS-arm64
          path: |
            release/SecretArea-${{ needs.check-version.outputs.version }}-mac-arm64.dmg
            release/SecretArea-${{ needs.check-version.outputs.version }}-mac-arm64.zip
            release/SecretArea-${{ needs.check-version.outputs.version }}-mac-arm64.zip.blockmap
            release/latest-mac-arm64.yml
          if-no-files-found: error
          retention-days: 5

  publish-release:
    name: Publish Multi-Platform GitHub Release
    needs: [check-version, build-windows, build-linux, build-macos-x64, build-macos-arm64]
    if: ${{ needs.check-version.outputs.should_release == 'true' && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' && needs.build-macos-x64.result == 'success' && needs.build-macos-arm64.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows release artifacts
        uses: actions/download-artifact@v4
        with:
          name: SecretArea-${{ needs.check-version.outputs.tag }}-Windows
          path: artifacts/windows

      - name: Download Linux release artifacts
        uses: actions/download-artifact@v4
        with:
          name: SecretArea-${{ needs.check-version.outputs.tag }}-Linux
          path: artifacts/linux

      - name: Download macOS x64 release artifacts
        uses: actions/download-artifact@v4
        with:
          name: SecretArea-${{ needs.check-version.outputs.tag }}-macOS-x64
          path: artifacts/macos-x64

      - name: Download macOS arm64 release artifacts
        uses: actions/download-artifact@v4
        with:
          name: SecretArea-${{ needs.check-version.outputs.tag }}-macOS-arm64
          path: artifacts/macos-arm64

      - name: Validate all platform release files, merge latest-mac.yml, and stage stable download aliases
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail

          VERSIONED_WIN_EXE="artifacts/windows/SecretArea.exe"
          VERSIONED_WIN_BLOCKMAP="artifacts/windows/SecretArea.exe.blockmap"
          WIN_LATEST_YML="artifacts/windows/latest.yml"
          VERSIONED_APPIMAGE="artifacts/linux/SecretArea-${EXPECTED_VERSION}-linux-x86_64.AppImage"
          VERSIONED_DEB="artifacts/linux/SecretArea-${EXPECTED_VERSION}-linux-amd64.deb"
          LINUX_LATEST_YML="artifacts/linux/latest-linux.yml"
          VERSIONED_MAC_X64_DMG="artifacts/macos-x64/SecretArea-${EXPECTED_VERSION}-mac-x64.dmg"
          VERSIONED_MAC_X64_ZIP="artifacts/macos-x64/SecretArea-${EXPECTED_VERSION}-mac-x64.zip"
          VERSIONED_MAC_X64_BLOCKMAP="artifacts/macos-x64/SecretArea-${EXPECTED_VERSION}-mac-x64.zip.blockmap"
          MAC_X64_YML="artifacts/macos-x64/latest-mac-x64.yml"
          VERSIONED_MAC_ARM64_DMG="artifacts/macos-arm64/SecretArea-${EXPECTED_VERSION}-mac-arm64.dmg"
          VERSIONED_MAC_ARM64_ZIP="artifacts/macos-arm64/SecretArea-${EXPECTED_VERSION}-mac-arm64.zip"
          VERSIONED_MAC_ARM64_BLOCKMAP="artifacts/macos-arm64/SecretArea-${EXPECTED_VERSION}-mac-arm64.zip.blockmap"
          MAC_ARM64_YML="artifacts/macos-arm64/latest-mac-arm64.yml"

          REQUIRED=(
            "$VERSIONED_WIN_EXE"
            "$VERSIONED_WIN_BLOCKMAP"
            "$WIN_LATEST_YML"
            "$VERSIONED_APPIMAGE"
            "$VERSIONED_DEB"
            "$LINUX_LATEST_YML"
            "$VERSIONED_MAC_X64_DMG"
            "$VERSIONED_MAC_X64_ZIP"
            "$VERSIONED_MAC_X64_BLOCKMAP"
            "$MAC_X64_YML"
            "$VERSIONED_MAC_ARM64_DMG"
            "$VERSIONED_MAC_ARM64_ZIP"
            "$VERSIONED_MAC_ARM64_BLOCKMAP"
            "$MAC_ARM64_YML"
          )

          for file in "${REQUIRED[@]}"; do
            if [ ! -s "$file" ]; then
              echo "Missing or empty staged release asset: $file" >&2
              exit 1
            fi
            ls -lh "$file"
          done

          mkdir -p artifacts/macos

          # Merge per-arch latest-mac.yml files, validate cryptographic SHA-512 parity, and verify Windows + Linux metadata
          EXPECTED_VERSION="$EXPECTED_VERSION" node << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const ver = process.env.EXPECTED_VERSION;
          const escapeRegExp = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const winYml = fs.readFileSync('artifacts/windows/latest.yml', 'utf8');
          const linuxYml = fs.readFileSync('artifacts/linux/latest-linux.yml', 'utf8');
          const verLine = new RegExp(`^version:\\s*['"]?${escapeRegExp(ver)}['"]?\\s*$`, 'm');

          if (!verLine.test(winYml) || !winYml.includes('SecretArea.exe')) {
            throw new Error('artifacts/windows/latest.yml failed version/SecretArea.exe check.');
          }
          if (
            !verLine.test(linuxYml) ||
            !linuxYml.includes(`SecretArea-${ver}-linux-x86_64.AppImage`) ||
            !linuxYml.includes(`SecretArea-${ver}-linux-amd64.deb`)
          ) {
            throw new Error('artifacts/linux/latest-linux.yml failed version/artifact reference check.');
          }

          function parseLatestMacFileEntries(ymlText) {
            const lines = String(ymlText || '').split(/\r?\n/);
            const entries = [];
            let current = null;
            let inFiles = false;
            let versionVal = '';
            let releaseDateVal = '';
            let minSysVersionVal = '';
            for (const line of lines) {
              if (!inFiles && /^version:\s*(.+)$/.test(line)) {
                versionVal = line.replace(/^version:\s*/, '').trim().replace(/^['"]|['"]$/g, '');
                continue;
              }
              if (/^releaseDate:\s*(.+)$/.test(line)) {
                releaseDateVal = line.replace(/^releaseDate:\s*/, '').trim().replace(/^['"]|['"]$/g, '');
                inFiles = false;
                continue;
              }
              if (/^minimumSystemVersion:\s*(.+)$/.test(line)) {
                minSysVersionVal = line.replace(/^minimumSystemVersion:\s*/, '').trim().replace(/^['"]|['"]$/g, '');
                inFiles = false;
                continue;
              }
              if (/^files:\s*$/.test(line)) {
                inFiles = true;
                continue;
              }
              if (inFiles && /^\S/.test(line)) {
                inFiles = false;
              }
              if (!inFiles) continue;
              const startMatch = line.match(/^\s*-\s+([A-Za-z0-9_]+):\s*(.*)$/);
              if (startMatch) {
                if (current) entries.push(current);
                current = { [startMatch[1]]: startMatch[2].trim().replace(/^['"]|['"]$/g, '') };
                continue;
              }
              const propMatch = line.match(/^\s{2,}([A-Za-z0-9_]+):\s*(.*)$/);
              if (propMatch && current) {
                current[propMatch[1]] = propMatch[2].trim().replace(/^['"]|['"]$/g, '');
              }
            }
            if (current) entries.push(current);
            return { versionVal, releaseDateVal, minSysVersionVal, entries };
          }

          const x64Parsed = parseLatestMacFileEntries(fs.readFileSync('artifacts/macos-x64/latest-mac-x64.yml', 'utf8'));
          const arm64Parsed = parseLatestMacFileEntries(fs.readFileSync('artifacts/macos-arm64/latest-mac-arm64.yml', 'utf8'));

          if (x64Parsed.versionVal !== ver || arm64Parsed.versionVal !== ver) {
            throw new Error(`macOS YAML version mismatch: x64=${x64Parsed.versionVal} arm64=${arm64Parsed.versionVal} expected=${ver}`);
          }

          const expectedX64Zip = `SecretArea-${ver}-mac-x64.zip`;
          const expectedArm64Zip = `SecretArea-${ver}-mac-arm64.zip`;
          const x64ZipEntry = x64Parsed.entries.find((e) => e.url === expectedX64Zip);
          const arm64ZipEntry = arm64Parsed.entries.find((e) => e.url === expectedArm64Zip);

          if (!x64ZipEntry || !x64ZipEntry.sha512) {
            throw new Error(`artifacts/macos-x64/latest-mac-x64.yml missing ZIP entry for ${expectedX64Zip}`);
          }
          if (!arm64ZipEntry || !arm64ZipEntry.sha512) {
            throw new Error(`artifacts/macos-arm64/latest-mac-arm64.yml missing ZIP entry for ${expectedArm64Zip}`);
          }
          if (x64ZipEntry.url.includes('arm64') || !arm64ZipEntry.url.includes('arm64')) {
            throw new Error('macOS architecture naming check failed for MacUpdater arch filter.');
          }

          const verifyBinarySha512 = (zipFilePath, entry, label) => {
            const buf = fs.readFileSync(zipFilePath);
            const actualSha512 = crypto.createHash('sha512').update(buf).digest('base64');
            if (entry.sha512 !== actualSha512) {
              throw new Error(`${label} sha512 mismatch in latest-mac.yml (${entry.sha512} !== ${actualSha512})`);
            }
            if (entry.size && Number(entry.size) !== buf.length) {
              throw new Error(`${label} size mismatch in latest-mac.yml (${entry.size} !== ${buf.length})`);
            }
          };

          verifyBinarySha512(path.join('artifacts/macos-x64', expectedX64Zip), x64ZipEntry, 'x64');
          verifyBinarySha512(path.join('artifacts/macos-arm64', expectedArm64Zip), arm64ZipEntry, 'arm64');

          const dedupedByUrl = new Map();
          for (const entry of [...arm64Parsed.entries, ...x64Parsed.entries]) {
            if (entry && entry.url && !dedupedByUrl.has(entry.url)) {
              dedupedByUrl.set(entry.url, entry);
            }
          }

          const serializedEntries = Array.from(dedupedByUrl.values())
            .map((entry) => {
              const outLines = [`  - url: ${entry.url}`, `    sha512: ${entry.sha512}`];
              if (entry.size) outLines.push(`    size: ${entry.size}`);
              if (entry.blockMapSize) outLines.push(`    blockMapSize: ${entry.blockMapSize}`);
              return outLines.join('\n');
            })
            .join('\n');

          const releaseDate = arm64Parsed.releaseDateVal || x64Parsed.releaseDateVal || new Date().toISOString();
          const minSysVer = arm64Parsed.minSysVersionVal || x64Parsed.minSysVersionVal;
          const mergedLines = [
            `version: ${ver}`,
            'files:',
            serializedEntries,
            `path: ${arm64ZipEntry.url}`,
            `sha512: ${arm64ZipEntry.sha512}`,
          ];
          if (minSysVer) {
            mergedLines.push(`minimumSystemVersion: '${minSysVer}'`);
          }
          mergedLines.push(`releaseDate: '${releaseDate}'`, '');
          const mergedYml = mergedLines.join('\n');

          fs.writeFileSync('artifacts/macos/latest-mac.yml', mergedYml, 'utf8');
          console.log('--- merged artifacts/macos/latest-mac.yml ---');
          console.log(mergedYml);
          EOF

          # Always start with a clean alias directory so older release files can never leak in
          rm -rf artifacts/aliases
          mkdir -p artifacts/aliases

          ALIAS_APPIMAGE="artifacts/aliases/SecretArea-linux-x86_64.AppImage"
          ALIAS_DEB="artifacts/aliases/SecretArea-linux-amd64.deb"
          ALIAS_MAC_INTEL="artifacts/aliases/SecretArea-macOS-Intel.dmg"
          ALIAS_MAC_ARM64="artifacts/aliases/SecretArea-macOS-AppleSilicon.dmg"

          cp -f "$VERSIONED_APPIMAGE" "$ALIAS_APPIMAGE"
          cp -f "$VERSIONED_DEB" "$ALIAS_DEB"
          cp -f "$VERSIONED_MAC_X64_DMG" "$ALIAS_MAC_INTEL"
          cp -f "$VERSIONED_MAC_ARM64_DMG" "$ALIAS_MAC_ARM64"
          chmod +x "$ALIAS_APPIMAGE"

          # Verify exact byte-for-byte parity between versioned binaries and stable aliases
          verify_alias() {
            local src="$1"
            local dst="$2"
            if [ ! -s "$dst" ]; then
              echo "Missing or empty stable alias: $dst" >&2
              exit 1
            fi
            local src_size dst_size src_sha dst_sha
            src_size=$(wc -c < "$src")
            dst_size=$(wc -c < "$dst")
            src_sha=$(sha256sum "$src" | awk '{print $1}')
            dst_sha=$(sha256sum "$dst" | awk '{print $1}')
            if [ "$src_size" != "$dst_size" ] || [ "$src_sha" != "$dst_sha" ]; then
              echo "Checksum or size mismatch for alias $dst ($src_sha vs $dst_sha)" >&2
              exit 1
            fi
            echo "Verified stable alias: $dst (${dst_size} bytes, sha256=${dst_sha})"
          }

          verify_alias "$VERSIONED_APPIMAGE" "$ALIAS_APPIMAGE"
          verify_alias "$VERSIONED_DEB" "$ALIAS_DEB"
          verify_alias "$VERSIONED_MAC_X64_DMG" "$ALIAS_MAC_INTEL"
          verify_alias "$VERSIONED_MAC_ARM64_DMG" "$ALIAS_MAC_ARM64"

          # Record local cryptographic SHA-256 & byte-size manifest for post-upload remote verification
          EXPECTED_VERSION="$EXPECTED_VERSION" node << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const ver = process.env.EXPECTED_VERSION;

          const stagedFiles = [
            'artifacts/windows/SecretArea.exe',
            'artifacts/windows/SecretArea.exe.blockmap',
            'artifacts/windows/latest.yml',
            `artifacts/linux/SecretArea-${ver}-linux-x86_64.AppImage`,
            `artifacts/linux/SecretArea-${ver}-linux-amd64.deb`,
            'artifacts/linux/latest-linux.yml',
            `artifacts/macos-x64/SecretArea-${ver}-mac-x64.dmg`,
            `artifacts/macos-x64/SecretArea-${ver}-mac-x64.zip`,
            `artifacts/macos-x64/SecretArea-${ver}-mac-x64.zip.blockmap`,
            `artifacts/macos-arm64/SecretArea-${ver}-mac-arm64.dmg`,
            `artifacts/macos-arm64/SecretArea-${ver}-mac-arm64.zip`,
            `artifacts/macos-arm64/SecretArea-${ver}-mac-arm64.zip.blockmap`,
            'artifacts/macos/latest-mac.yml',
            'artifacts/aliases/SecretArea-linux-x86_64.AppImage',
            'artifacts/aliases/SecretArea-linux-amd64.deb',
            'artifacts/aliases/SecretArea-macOS-Intel.dmg',
            'artifacts/aliases/SecretArea-macOS-AppleSilicon.dmg',
          ];

          const manifest = {};
          for (const relPath of stagedFiles) {
            const buf = fs.readFileSync(relPath);
            const name = path.basename(relPath);
            manifest[name] = {
              size: buf.length,
              sha256: crypto.createHash('sha256').update(buf).digest('hex'),
            };
          }
          fs.writeFileSync('artifacts/expected-manifest.json', JSON.stringify(manifest, null, 2));
          console.log(`Recorded SHA-256 manifest for ${Object.keys(manifest).length} release assets.`);
          EOF

      - name: Determine release draft mode before asset upload
        id: release_state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          set -euo pipefail
          node << 'EOF'
          const fs = require('fs');
          const repo = process.env.REPOSITORY;
          const tag = process.env.RELEASE_TAG;
          const token = process.env.GH_TOKEN;

          (async () => {
            const res = await fetch(
              `https://api.github.com/repos/${repo}/releases/tags/${encodeURIComponent(tag)}`,
              {
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                },
              }
            );
            // For brand-new releases (404), create as draft first so all assets + aliases attach before going latest
            const useDraft = res.status === 404 ? 'true' : 'false';
            console.log(`Release ${tag} lookup status=${res.status}; use_draft=${useDraft}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `use_draft=${useDraft}\n`);
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF

      - name: Upload Windows, Linux & macOS Assets + Stable Download Aliases to GitHub Release
        id: gh_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: SecretArea Desktop ${{ needs.check-version.outputs.tag }}
          draft: ${{ steps.release_state.outputs.use_draft == 'true' }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            artifacts/windows/SecretArea.exe
            artifacts/windows/SecretArea.exe.blockmap
            artifacts/windows/latest.yml
            artifacts/linux/SecretArea-${{ needs.check-version.outputs.version }}-linux-x86_64.AppImage
            artifacts/linux/SecretArea-${{ needs.check-version.outputs.version }}-linux-amd64.deb
            artifacts/linux/latest-linux.yml
            artifacts/macos-x64/SecretArea-${{ needs.check-version.outputs.version }}-mac-x64.dmg
            artifacts/macos-x64/SecretArea-${{ needs.check-version.outputs.version }}-mac-x64.zip
            artifacts/macos-x64/SecretArea-${{ needs.check-version.outputs.version }}-mac-x64.zip.blockmap
            artifacts/macos-arm64/SecretArea-${{ needs.check-version.outputs.version }}-mac-arm64.dmg
            artifacts/macos-arm64/SecretArea-${{ needs.check-version.outputs.version }}-mac-arm64.zip
            artifacts/macos-arm64/SecretArea-${{ needs.check-version.outputs.version }}-mac-arm64.zip.blockmap
            artifacts/macos/latest-mac.yml
            artifacts/aliases/SecretArea-linux-x86_64.AppImage
            artifacts/aliases/SecretArea-linux-amd64.deb
            artifacts/aliases/SecretArea-macOS-Intel.dmg
            artifacts/aliases/SecretArea-macOS-AppleSilicon.dmg

      - name: Verify all uploaded assets (remote byte-size & SHA-256) & publish release as latest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.check-version.outputs.tag }}
          RELEASE_ID: ${{ steps.gh_release.outputs.id }}
          EXPECTED_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          node << 'EOF'
          const fs = require('fs');
          const crypto = require('crypto');
          const repo = process.env.REPOSITORY;
          const tag = process.env.RELEASE_TAG;
          const releaseId = (process.env.RELEASE_ID || '').trim();
          const version = process.env.EXPECTED_VERSION;
          const token = process.env.GH_TOKEN;

          const manifest = JSON.parse(fs.readFileSync('artifacts/expected-manifest.json', 'utf8'));
          const headers = {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
          };

          async function downloadAndHashRemoteAsset(asset) {
            const res = await fetch(asset.url, {
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: 'application/octet-stream',
                'X-GitHub-Api-Version': '2022-11-28',
              },
              redirect: 'follow',
            });
            if (!res.ok || !res.body) {
              throw new Error(`Failed remote asset download for ${asset.name} (HTTP ${res.status})`);
            }
            const hash = crypto.createHash('sha256');
            let downloadedBytes = 0;
            for await (const chunk of res.body) {
              const buf = Buffer.from(chunk);
              hash.update(buf);
              downloadedBytes += buf.length;
            }
            return {
              bytes: downloadedBytes,
              sha256: hash.digest('hex'),
            };
          }

          (async () => {
            let rel = null;
            if (releaseId) {
              const directRes = await fetch(
                `https://api.github.com/repos/${repo}/releases/${encodeURIComponent(releaseId)}`,
                { headers }
              );
              if (directRes.ok) {
                rel = await directRes.json();
              }
            }
            if (!rel) {
              const listRes = await fetch(`https://api.github.com/repos/${repo}/releases?per_page=25`, {
                headers,
              });
              if (!listRes.ok) {
                throw new Error(`Failed to list releases (HTTP ${listRes.status})`);
              }
              const releases = await listRes.json();
              rel = releases.find((r) => r && r.tag_name === tag) || null;
            }
            if (!rel) {
              throw new Error(`Release ${tag} was not found after asset upload.`);
            }

            const expectedAssets = Object.keys(manifest);
            const assets = Array.isArray(rel.assets) ? rel.assets : [];
            const byName = new Map(assets.map((a) => [a.name, a]));
            const remoteDigests = new Map();

            for (const name of expectedAssets) {
              const asset = byName.get(name);
              const expected = manifest[name];
              if (!asset || !asset.size || asset.size <= 0) {
                throw new Error(`Uploaded release ${tag} is missing or has empty asset: ${name}`);
              }
              if (asset.size !== expected.size) {
                throw new Error(`Uploaded release asset ${name} size mismatch: remote=${asset.size} expected=${expected.size}`);
              }
              const remote = await downloadAndHashRemoteAsset(asset);
              if (remote.bytes !== expected.size || remote.sha256 !== expected.sha256) {
                throw new Error(
                  `Remote SHA-256 verification failed for ${name}: remote=${remote.sha256} (${remote.bytes}B) expected=${expected.sha256} (${expected.size}B)`
                );
              }
              remoteDigests.set(name, remote.sha256);
              console.log(`Confirmed remote asset ${name}: ${remote.bytes} bytes, sha256=${remote.sha256}`);
            }

            const parityPairs = [
              [`SecretArea-${version}-linux-x86_64.AppImage`, 'SecretArea-linux-x86_64.AppImage'],
              [`SecretArea-${version}-linux-amd64.deb`, 'SecretArea-linux-amd64.deb'],
              [`SecretArea-${version}-mac-x64.dmg`, 'SecretArea-macOS-Intel.dmg'],
              [`SecretArea-${version}-mac-arm64.dmg`, 'SecretArea-macOS-AppleSilicon.dmg'],
            ];
            for (const [verName, aliasName] of parityPairs) {
              const vAsset = byName.get(verName);
              const aAsset = byName.get(aliasName);
              if (vAsset.size !== aAsset.size) {
                throw new Error(`Alias size mismatch for ${aliasName}: ${aAsset.size} !== ${vAsset.size}`);
              }
              if (remoteDigests.get(verName) !== remoteDigests.get(aliasName)) {
                throw new Error(`Remote SHA-256 alias mismatch for ${aliasName} vs ${verName}`);
              }
            }

            // Now that every original asset, update metadata file, and stable alias is remotely verified, mark release published & latest
            const publishRes = await fetch(`https://api.github.com/repos/${repo}/releases/${rel.id}`, {
              method: 'PATCH',
              headers: {
                ...headers,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                draft: false,
                make_latest: 'true',
              }),
            });
            if (!publishRes.ok) {
              const body = await publishRes.text().catch(() => '');
              throw new Error(`Failed to finalize release ${tag} (HTTP ${publishRes.status}): ${body}`);
            }

            const updated = await publishRes.json();
            console.log(`Release ${updated.tag_name} finalized cleanly (draft=${updated.draft}).`);
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF